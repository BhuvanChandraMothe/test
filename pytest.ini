[pytest]
# Pytest configuration for SAP OData Connector

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    integration: Integration tests that require real SAP server connection
    unit: Unit tests with mocked dependencies
    slow: Tests that take longer to execute
    
# Asyncio mode
asyncio_mode = auto

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.8

# Coverage options (if using pytest-cov)
[coverage:run]
source = odc
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
